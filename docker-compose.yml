services:

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - biblioteca-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    networks:
      - biblioteca-net
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - biblioteca-net
    depends_on:
      config-server:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - biblioteca-net
    depends_on:
      config-server:
        condition: service_healthy

  libros-service:
    build: ./libros-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - biblioteca-net
    depends_on:
      config-server:
        condition: service_healthy

  prestamos-service:
    build: ./prestamos-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - biblioteca-net
    depends_on:
      config-server:
        condition: service_healthy

  notificaciones-service:
    build: ./notificaciones-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - biblioteca-net
    depends_on:
      config-server:
        condition: service_healthy

networks:
  biblioteca-net:
    driver: bridge
