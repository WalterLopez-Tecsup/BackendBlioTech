server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: libros-publico
              uri: lb://libros-service
              predicates:
                - Path=/public/libros
              filters:
                - RewritePath=/public/libros, /api/v1/libros

            - id: libros
              uri: lb://libros-service
              predicates:
                - Path=/api/v1/libros/**

            - id: socios
              uri: lb://libros-service
              predicates:
                - Path=/api/v1/socios/**

            - id: prestamos
              uri: lb://prestamos-service
              predicates:
                - Path=/api/v1/prestamos/**

            - id: pedidos
              uri: lb://prestamos-service
              predicates:
                - Path=/api/v1/pedidos/**

            - id: notificaciones
              uri: lb://notificaciones-service
              predicates:
                - Path=/api/v1/notificaciones/**


cors:
  allowed-origins: "http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:8080"

